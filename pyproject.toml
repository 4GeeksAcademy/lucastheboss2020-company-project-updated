[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "trackflow"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "tinydb>=4.8.0",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "sqlmodel>=0.0.48",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary]>=3.2.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0",
    "python-jose>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt<4.1",
    "email-validator>=2.0",
]
scripts = { seed = "services.suppliers.seed:main", seed-incidents = "scripts.seed_incidents:main", seed-inventory = "services.seed_inventory:main" }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "python-jose>=3.3",
    "passlib[bcrypt]>=1.7",
    "bcrypt<4.1",
    "email-validator>=2.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["services*", "backend*", "scripts*", "packages*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "services/suppliers/tests", "services/incidents/tests", "services/tests"]

[tool.coverage.run]
branch = true
source = ["backend.auth"]

[tool.coverage.report]
fail_under = 70

[tool.ruff]
line-length = 120
target-version = "py311"
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
