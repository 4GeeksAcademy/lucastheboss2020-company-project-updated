[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "trackflow"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "tinydb>=4.8.0",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
]
scripts = { seed = "services.suppliers.seed:main", seed-incidents = "scripts.seed_incidents:main" }

[tool.setuptools.packages.find]
include = ["services*", "backend*", "scripts*", "packages*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "services/suppliers/tests", "services/incidents/tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]