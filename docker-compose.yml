services:
  api:
    build:
      context: .
      dockerfile: services/Dockerfile
    env_file:
      - ./backend/.env
    environment:
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3001}
      TELEMETRY_DATABASE_URL: ${TELEMETRY_DATABASE_URL:-}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app/backend
      - ./services:/app/services
      - ./packages:/app/packages
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./scripts:/app/scripts
      - ./data:/app/data
    networks:
      - trackflow
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - trackflow

  redis:
    image: redis:7.4.6-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - trackflow
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: services/Dockerfile
    command: ["celery", "-A", "services.celery_app:app", "worker", "--loglevel=info", "--hostname=reporting@%h"]
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./services:/app/services
      - ./backend:/app/backend
      - ./packages:/app/packages
      - ./scripts:/app/scripts
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - trackflow

  flower:
    build:
      context: .
      dockerfile: services/Dockerfile
    command: ["celery", "-A", "services.celery_app:app", "flower", "--port=5555"]
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:5555:5555"
    volumes:
      - ./services:/app/services
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - trackflow

  ui:
    build:
      context: .
      dockerfile: uis/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
      BACKOFFICE_INTERNAL_URL: http://ui:3001
      NEXT_PUBLIC_WEBSITE_URL: ${NEXT_PUBLIC_WEBSITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_BACKOFFICE_URL: ${NEXT_PUBLIC_BACKOFFICE_URL:-http://localhost:3001}
      TRACKFLOW_REPO_ROOT: /app
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_TELEMETRY_ENDPOINT: ${NEXT_PUBLIC_TELEMETRY_ENDPOINT:-/api/telemetry/events}
    ports:
      - "${UI_PORT:-3000}:3000"
      - "${BACKOFFICE_PORT:-3001}:3001"
    volumes:
      - ./app:/app/app
      - ./src:/app/src
      - ./uis:/app/uis
      - ./scripts:/app/scripts
      - ./packages:/app/packages
      - ./package.json:/app/package.json:ro
      - ./package-lock.json:/app/package-lock.json:ro
      - ./next.config.mjs:/app/next.config.mjs:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ui_website_node_modules:/app/uis/website/node_modules
      - ui_backoffice_node_modules:/app/uis/backoffice/node_modules
      - ui_website_next:/app/uis/website/.next
      - ui_backoffice_next:/app/uis/backoffice/.next
    depends_on:
      api:
        condition: service_healthy
    networks:
      - trackflow

networks:
  trackflow:
    name: trackflow-dev

volumes:
  redis_data:
  qdrant_data:
  ui_website_node_modules:
  ui_backoffice_node_modules:
  ui_website_next:
  ui_backoffice_next: