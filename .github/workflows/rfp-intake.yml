name: TrackFlow RFP intake
'on':
  push:
    branches: [Milestone-9]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rfp_test
          POSTGRES_PASSWORD: rfp_test
          POSTGRES_DB: rfp_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U rfp_test -d rfp_test" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: sqlite://
      TEST_RFP_DATABASE_URL: postgresql+psycopg://rfp_test:rfp_test@localhost:5432/rfp_test
      REDIS_URL: redis://localhost:6379/15
      HF_HUB_OFFLINE: '1'
      RAG_API_KEY: ''
      RAG_API_BASE_URL: ''
      RAG_GENERATION_MODEL: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.12.17'
          python-version: '3.14'
          enable-cache: true
      - run: uv sync --locked --group dev
      - name: Intake guards, API, persistence and PostgreSQL concurrency
        run: >-
          uv run --no-sync python -m pytest
          tests/pipelines/test_rfp_intake.py tests/pipelines/test_rfp_api.py
          tests/pipelines/test_rfp_postgres.py tests/pipelines/test_rfp_task_entrypoint.py -q --tb=short
      - name: Proposal generation, bounded revisions, API and PostgreSQL
        run: >-
          uv run --no-sync python -m pytest
          tests/pipelines/test_rfp_proposal.py tests/pipelines/test_rfp_proposal_api.py
          tests/pipelines/test_rfp_proposal_postgres.py -q --tb=short
      - name: Existing agent, memory and MCP regressions
        run: >-
          uv run --no-sync python -m pytest
          tests/agent_harness tests/agent_memory tests/mcps
          tests/pipelines/test_rag.py tests/pipelines/test_pipeline.py
          tests/pipelines/test_agent_graph.py tests/pipelines/test_offline_replay.py
          -q --tb=short
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
